<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | CLEAN CITY 2026</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <main>
        <section class="section registration-form-section">
            <div class="registration-container">
                <form class="registration-form" action="#" method="post">
                    <div class="registration-hero">
                        <h1>Inscription — CLEAN CITY 2026</h1>
                        <div class="registration-divider"></div>
                        <p class="registration-subtitle">Porto-Novo, Bénin · Septembre 2026</p>
                    </div>

                    <div class="form-row form-row-full">
                        <div class="form-group form-group-switch">
                            <div class="form-switch">
                                <label class="form-option active">
                                    <input type="radio" name="type" value="participant" checked>
                                    <span class="form-sticker">👤</span>
                                    Participant
                                </label>
                                <label class="form-option">
                                    <input type="radio" name="type" value="benevole">
                                    <span class="form-sticker">🤝</span>
                                    Bénévole
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-separator" aria-hidden="true"></div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                        </div>

                        <div class="form-group">
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="telephone">Numéro de téléphone</label>
                            <input type="tel" id="telephone" name="telephone" placeholder="+229 00 00 00 00" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-column">
                            <div class="form-group">
                                <label for="ville">Ville de résidence</label>
                                <input type="text" id="ville" name="ville" placeholder="Porto-Novo" required>
                            </div>

                            <div class="form-group">
                                <label for="statut">Statut</label>
                                <select id="statut" name="statut" required>
                                    <option value="">Sélectionnez votre statut</option>
                                    <option value="etudiant">Étudiant</option>
                                    <option value="professionnel">Professionnel</option>
                                    <option value="citoyen">Citoyen engagé</option>
                                    <option value="autre">Autre</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-column">
                            <div class="form-group">
                                <label for="organisation">Organisation</label>
                                <input type="text" id="organisation" name="organisation"
                                    placeholder="AIESEC, collectivité, association..." required>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">S'inscrire</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
